[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "config-rationalizer"
version = "0.1.0"
description = "Safe post-upgrade configuration comparison and rationalization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "ruamel.yaml>=0.18",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
config-rationalizer = "config_rationalizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["config_rationalizer"]

[tool.coverage.report]
show_missing = true

dependencies = [
    # existing dependencies...
    "lxml>=5.0",
]